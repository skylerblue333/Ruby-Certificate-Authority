name: ruby-ca-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Syntax
        run: ruby -c lib/sky_ca.rb && ruby -c test/sky_ca_test.rb
      - name: Tests
        run: ruby -Ilib:test test/sky_ca_test.rb
      - name: OpenSSL runtime
        run: ruby -ropenssl -e 'abort "OpenSSL unavailable" unless defined?(OpenSSL::X509)'
      - name: Build image
        run: docker build -t sky-ca:${{ github.sha }} .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-ca:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
      - name: Container self-test
        run: docker run --rm sky-ca:${{ github.sha }}
